; CPUAPP.EXE reads this file from its own directory.
; Every field below is metadata only. No CPUID/ISA/speed enforcement exists.
; speed_hint_mhz is a requested policy target, never a measured MHz value.

[profile.i386]
isa_hint=80386
speed_hint_mhz=33

[profile.i486]
isa_hint=80486DX
speed_hint_mhz=66

[profile.pentium_mmx]
isa_hint=Pentium MMX
speed_hint_mhz=233

[profile.pentium_ii]
isa_hint=Pentium II
speed_hint_mhz=450

[profile.pentium_iii]
isa_hint=Pentium III
speed_hint_mhz=1000

[profile.modern]
isa_hint=Host-compatible modern x86
speed_hint_mhz=0

; Example mapping. Change this section to select a profile for Notepad.
; Mapping key is the executable basename, case-insensitive in Windows INI.
[app.NOTEPAD.EXE]
profile=modern
